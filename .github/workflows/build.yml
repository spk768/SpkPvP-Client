name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testes (launcher e servidor da loja)
        run: python -m unittest discover -s tests -v

  mod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"
      - name: Compilar mod
        working-directory: mod
        run: gradle build --no-daemon
      - name: Renomear jar
        run: |
          mkdir dist
          cp $(ls mod/build/libs/*.jar | grep -v -- '-sources' | head -1) dist/spkpvp-1.21.1.jar
      - uses: actions/upload-artifact@v4
        with:
          name: spkpvp-mod
          path: dist/spkpvp-1.21.1.jar

  windows:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compilar SpkPvP.exe
        working-directory: launcher
        run: |
          pip install pyinstaller
          pyinstaller --onefile --noconsole --name SpkPvP --add-data "spkpvp/web;spkpvp/web" launcher.py
      - uses: actions/upload-artifact@v4
        with:
          name: SpkPvP-windows
          path: launcher/dist/SpkPvP.exe

  release:
    if: github.event_name == 'push' && (github.ref_name == github.event.repository.default_branch || startsWith(github.ref, 'refs/tags/'))
    needs: [mod, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: SpkPvP Client ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '(build mais recente)' }}
          make_latest: true
          target_commitish: ${{ github.sha }}
          files: |
            dist/SpkPvP.exe
            dist/spkpvp-1.21.1.jar
