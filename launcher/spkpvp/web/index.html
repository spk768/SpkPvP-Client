<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SpkPvP Client</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23e8e8e8'/%3E%3Cpath d='M21 9h-7a3 3 0 0 0 0 6h4a3 3 0 0 1 0 6h-7' stroke='%23141414' stroke-width='3' fill='none'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand"><span class="logo">S</span><span>SpkPvP Client</span></div>
    <nav class="tabs" id="nav">
      <button data-nav="home">Jogar</button>
      <button data-nav="mods">Mods</button>
      <button data-nav="store">Loja</button>
      <button data-nav="wardrobe">Guarda-roupa</button>
      <button data-nav="logs">Logs</button>
    </nav>
    <div class="topbar-right">
      <button class="icon-btn cart-btn" id="btn-cart" title="Carrinho"></button>
      <button class="icon-btn" id="btn-settings" title="Configurações"></button>
      <button class="account-chip" id="btn-account"></button>
    </div>
  </header>
  <div class="body">
    <aside class="sidebar">
      <div id="side-play"></div>
      <div class="sidebar-list" id="sidebar-list"></div>
      <div class="tasks" id="tasks"></div>
    </aside>
    <main id="view"></main>
  </div>
</div>
<div id="modal-root"></div>
<div id="toasts"></div>
<script src="app.js"></script>
</body>
</html>
